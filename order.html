<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sayat Maksatuly">
    <title>Оформление заказа — Dielly Flowers &amp; Bags</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sayat.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О бутике</a></li>
                <li><a href="flowers.html">Цветы</a></li>
                <li><a href="bags.html">Сумки</a></li>
                <li><a href="order.html" class="active">Заказ</a></li>
                <li><a href="login.html">Вход</a></li>
                <li><a href="register.html">Регистрация</a></li>
                <li><a href="colophon.html">О проекте</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <form action="#" method="post">
                <fieldset>
                    <legend>Оформление заказа</legend>
                    <label for="orderName">Ваше имя:</label>
                    <input type="text" id="orderName" name="name" placeholder="Введите ваше имя" required>

                    <label for="orderPhone">Телефон:</label>
                    <input type="tel" id="orderPhone" name="phone" placeholder="+7 (701) 380-58-56" required>

                    <label for="productSelect">Выберите товар:</label>
                    <select id="productSelect" name="product" required>
                        <option value="" disabled selected>-- Нажмите для выбора --</option>
                        <optgroup label="Эксклюзивные цветы">
                            <option value="101-rose">101 роза (50 000 ₸)</option>
                            <option value="gortenzia-royal">Королевская гортензия (100 000 ₸)</option>
                            <option value="mix-gortenzia">Микс с гортензией (60 000 ₸)</option>
                            <option value="love-basket">Корзинка любви (45 000 ₸)</option>
                            <option value="eustoma">Воздушная эустома (65 000 ₸)</option>
                        </optgroup>
                        <optgroup label="Дизайнерские сумки">
                            <option value="shopper">Фирменный шопер (45 000 ₸)</option>
                            <option value="gucci">Сумка Gucci (35 000 ₸)</option>
                            <option value="fendi">Сумка Fendi (55 000 ₸)</option>
                            <option value="hermes">Сумка Hermès (85 000 ₸)</option>
                        </optgroup>
                    </select>

                    <label for="deliveryAddress">Адрес доставки:</label>
                    <input type="text" id="deliveryAddress" name="address" placeholder="Улица, дом, квартира" required>

                    <label for="orderComments">Текст для бесплатной открытки (необязательно):</label>
                    <textarea id="orderComments" name="comments" rows="3"></textarea>

                    <button type="submit">Подтвердить заказ</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>Адрес: пр. Аль-Фараби, 15/1 | Телефон: <a href="tel:+77013805856">+7-701-380-5856</a></p>
    </footer>
</body>
</html>
